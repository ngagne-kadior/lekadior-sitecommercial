<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Espace privé : jamais indexé par les moteurs de recherche -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <title>Administration — Le Kadior</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Démarrage : affiché le temps de vérifier la session -->
  <div id="boot" class="boot">Chargement…</div>

  <!-- Connexion -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" novalidate>
      <div class="login-brand">
        <img src="../assets/images/logo-lekadior.png" alt="Le Kadior" width="150" height="100">
        <h1>Espace administrateur</h1>
      </div>
      <p id="login-message" class="alert" hidden></p>
      <label>E-mail
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>Mot de passe
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      <a class="login-back" href="../index.html">← Retour au site</a>
    </form>
  </section>

  <!-- Administration (visible uniquement pour un compte admin) -->
  <div id="admin-view" class="layout" hidden>
    <aside class="sidebar">
      <header class="sidebar-brand">
        <img src="../assets/images/logo-lekadior.png" alt="Le Kadior" width="120" height="80">
        <span>Administration</span>
      </header>
      <nav class="nav" aria-label="Administration">
        <a href="#dashboard" data-section="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Tableau de bord</span>
        </a>
        <a href="#products" data-section="products">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span>Produits</span>
        </a>
        <a href="#categories" data-section="categories">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
          <span>Catégories</span>
        </a>
        <a href="#events" data-section="events">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>Événements</span>
        </a>
        <a href="#promotions" data-section="promotions">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8L3 12Z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>
          <span>Promotions</span>
        </a>
        <a href="#gallery" data-section="gallery">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
          <span>Galerie</span>
        </a>
        <a href="#settings" data-section="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span>Paramètres</span>
        </a>
      </nav>
      <footer class="sidebar-foot">
        <span id="user-email" class="user-email"></span>
        <div class="sidebar-actions">
          <a class="btn btn-ghost btn-small" href="../index.html" target="_blank" rel="noopener">Voir le site</a>
          <button id="logout" type="button" class="btn btn-ghost btn-small">Déconnexion</button>
        </div>
      </footer>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Configuration existante du site (clé PUBLIQUE uniquement) -->
  <script src="../data/supabase-config.js"></script>
  <!-- Bibliothèque officielle Supabase, version figée + contrôle d'intégrité -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
          crossorigin="anonymous"></script>
  <script src="admin.js"></script>
</body>
</html>
